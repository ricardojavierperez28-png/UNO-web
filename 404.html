<script>
/* UNO: medición de clics en WhatsApp y Registro (eventos clave GA4 + Meta Pixel si existe) */
document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a[href]');
  if (!a) return;
  var h = a.href || '', ev = null, fb = null;
  if (/wa\.me|api\.whatsapp\.com/.test(h)) { ev = 'click_whatsapp'; fb = 'Contact'; }
  else if (/app\.plataforma-uno\.com\/register/.test(h)) { ev = 'click_registro'; fb = 'Lead'; }
  if (!ev) return;
  var p = { link_url: h, pagina: location.pathname, ubicacion: (a.getAttribute('aria-label') || a.textContent || '').trim().slice(0, 50), transport_type: 'beacon' };
  if (window.gtag) gtag('event', ev, p);
  if (window.fbq) fbq('track', fb);
}, true);
</script>
